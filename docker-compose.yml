services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic_dd_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: dd_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dd_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
